set -g mouse on
set -s set-clipboard external
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g status-keys vi
setw -g mode-keys vi

# ============================================================
#  Capsule status bar  (2 rows)
#  Layout is defined here; COLORS come from the active theme,
#  applied by ~/.config/tmux/theme.sh (palettes in themes/).
#    Switch theme:  prefix + T      (menu)
#    Cycle theme:   prefix + Ctrl-t (next)
# ============================================================
set -g status 4
set -g status-interval 1
set -g status-justify centre

set -g status-left-length 40
set -g status-left ""
set -g status-right ""
set -g status-right-length 120
set -g window-status-separator ""

# --- 3-row layout (row 0 = top, row 2 = bottom) ---
# Row 0 is a half-height strip: lower-half blocks (▄) coloured in the bar
# background with a transparent top, faking ~half a line of padding.
# It's theme-coloured, so theme.sh sets status-format[0].
# row 1: centered window tabs (colours come from window-status-*format, themed)
set -g status-format[1] "#[align=centre]#{W:#{T:window-status-format},#{T:window-status-current-format}}"
# row 2: the info line (session · path … git · load · clock) is set by the theme
# row 3: mirror half-strip at the bottom edge (▀ = bar colour on top half);
#        also theme-coloured, so theme.sh sets status-format[3]

# apply the saved (or default) theme on load
run-shell "~/.config/tmux/theme.sh"

# --- theme switching --------------------------------------------------
# prefix + T : pick from a menu
bind-key T display-menu -T "#[align=centre] theme " -x C -y C \
  "Catppuccin Mocha" c "run-shell '~/.config/tmux/theme.sh mocha'" \
  "Nord"             n "run-shell '~/.config/tmux/theme.sh nord'" \
  "Gruvbox Dark"     g "run-shell '~/.config/tmux/theme.sh gruvbox'" \
  "Dracula"          d "run-shell '~/.config/tmux/theme.sh dracula'" \
  "Rosé Pine"        r "run-shell '~/.config/tmux/theme.sh rose-pine'" \
  "Cobalt2"          b "run-shell '~/.config/tmux/theme.sh cobalt2'" \
  "" \
  "Cycle next"     Tab "run-shell '~/.config/tmux/theme.sh next'"
# prefix + Ctrl-t : cycle to the next theme without opening the menu
bind-key C-t run-shell "~/.config/tmux/theme.sh next"
