# Static checks and unit tests on every change, plus the fresh-host apply so upstream
# installer or Ubuntu drift is caught weekly rather than during a rebuild.
name: check
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish shellcheck
      - run: bash scripts/check.sh
  fresh-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fresh-host.sh
